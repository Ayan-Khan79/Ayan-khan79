<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430">
<style>
.card{fill:#0d1117;stroke:#30363d;stroke-width:2}
.title{font:700 18px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#58a6ff}
.key{font:600 14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#8b949e}
.val{font:500 14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#c9d1d9}
.accent{fill:#3fb950}
.row{opacity:0;animation:fade .55s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
